# Hetzner VPS / your own Linux server (nginx)
# 1. Copy the CONTENTS of dist/ to /var/www/zach-of-all-trades
# 2. Copy this file to /etc/nginx/sites-available/zach-of-all-trades
# 3. sudo ln -s /etc/nginx/sites-available/zach-of-all-trades /etc/nginx/sites-enabled/
# 4. sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/zach-of-all-trades;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
