        </p>

        <p>
          The machine is specified for how you work and play: quiet workstations, gaming PCs with
          the GPU and cooling the titles need, and denser builds for the apps in the job.
          Performance, budget and space all go into the quote.
        </p>
        <ul>
          <li>Work PCs</li>
          <li>Gaming PCs</li>
          <li>Creative workstations</li>
          <li>Business machines</li>
        </ul>

        <p>
          Keep the machine you have. Change RAM, SSD, GPU or cooling — the parts that are actually
          the bottleneck. We tell you which, before you buy parts you do not need.
        </p>
        <ul>
          <li>RAM</li>
          <li>SSD</li>
          <li>GPU</li>
          <li>Cooling</li>
        </ul>

          repair: diagnostics first, then the failed part.
